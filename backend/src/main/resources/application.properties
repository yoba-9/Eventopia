# ========================================
# SWAGGER/OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# ========================================
# JWT CONFIGURATION
# ========================================
jwt.secret=RXZlbnRvcGlhU3VwZXJTZWNyZXRLZXkyMDIzIU1ha2VUaGlzVmVyeUxvbmdBbmRTZWN1cmU=
jwt.expiration=86400000
jwt.refresh.expiration=604800000
# ========================================
# CORS CONFIGURATION
# ========================================
cors.allowed-origins=http://localhost:3000,http://localhost:3001
# ========================================
# DATABASE CONFIGURATION
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/eventopia_db?allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Eventopia123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ========================================
# SERVER CONFIGURATION
